<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thirsty – fullscreen test</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12301F;text-decoration:none}a:hover{color:#0B1F14}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F7EF; color: #12301F; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

  <a href="TestDrive.dc.html" aria-label="Exit test and go back to Saywright" style="position: absolute; top: 50px; right: 12px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; z-index: 2">
    <span style="width: 30px; height: 30px; border-radius: 15px; background: rgba(20,20,20,0.62); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.18)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </span>
  </a>

  <div style="background: #1F7A4D; color: #FFFFFF; padding: 60px 20px 24px; display: flex; flex-direction: column; gap: 16px; border-radius: 0 0 28px 28px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 14px; color: #D3EBDD">Thursday</span>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 32px; letter-spacing: -0.02em">{{headline}}</span>
    </div>
    <div style="background: rgba(255,255,255,0.14); border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px">
      <div style="display: flex">
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #FFD66B; color: #12301F; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #1F7A4D">L</span>
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #BFE3FF; color: #12301F; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #1F7A4D; margin-left: -8px">J</span>
        <span style="width: 32px; height: 32px; border-radius: 16px; background: #FFFFFF; color: #12301F; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; border: 2px solid #1F7A4D; margin-left: -8px">You</span>
      </div>
      <span style="font-size: 14px; line-height: 1.35">{{turnLine}}</span>
    </div>
  </div>

  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 0 4px; font-size: 13px; font-weight: 600; color: #3F5E4B">Today</span>
    <sc-for list="{{plants}}" as="p" hint-placeholder-count="4">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 12px 12px 12px 14px; display: flex; align-items: center; gap: 12px">
        <div style="width: 48px; height: 48px; border-radius: 14px; background: #CFE5C6; color: #1F7A4D; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11"></path><path d="M12 11c0-4 3-6 7-6 0 4-3 6-7 6z"></path><path d="M12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0">
          <span style="font-weight: 600; font-size: 17px">{{p.name}}</span>
          <span style="font-size: 13px; color: #3F5E4B">{{p.status}}</span>
        </div>
        <sc-if value="{{p.due}}" hint-placeholder-val="{{ true }}">
          <button onClick="{{p.water}}" style="flex: none; height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #1F7A4D; color: #FFFFFF; font-family: 'Geist', sans-serif; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 6px; cursor: pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"></path></svg>
            Watered
          </button>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <button aria-label="Add a plant" style="position: absolute; right: 20px; bottom: 104px; width: 60px; height: 60px; border-radius: 30px; border: 0; background: #12301F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; box-shadow: 0 6px 16px rgba(18,48,31,0.25)">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </button>

  <nav aria-label="Thirsty" style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #DCE7D6; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px 8px 22px">
    <button style="height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Geist', sans-serif; font-size: 11px; font-weight: 600; color: #1F7A4D; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V11"></path><path d="M12 11c0-4 3-6 7-6 0 4-3 6-7 6z"></path><path d="M12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"></path></svg>
      Plants
    </button>
    <button style="height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Geist', sans-serif; font-size: 11px; color: #3F5E4B; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
      Schedule
    </button>
    <button style="height: 52px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: 'Geist', sans-serif; font-size: 11px; color: #3F5E4B; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M18 14a6.5 6.5 0 0 1 3.5 6"></path></svg>
      Flatmates
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { watered: {} };
  }
  renderVals() {
    const seed = [
      { id: 'm', name: 'Monstera', due: 'Needs water · Lea’s turn' },
      { id: 'p', name: 'Pilea', due: 'Needs water · your turn' },
      { id: 'f', name: 'Fern', done: 'Watered this morning by Jonas' },
      { id: 'b', name: 'Basil', done: 'Next in 2 days · Jonas' }
    ];
    const w = this.state.watered;
    const plants = seed.map((s) => {
      const isDue = !!s.due && !w[s.id];
      return {
        name: s.name,
        due: isDue,
        status: s.due ? (w[s.id] ? 'Watered just now · next turn: Jonas' : s.due) : s.done,
        water: () => this.setState({ watered: Object.assign({}, w, { [s.id]: true }) })
      };
    });
    const left = plants.filter((p) => p.due).length;
    return {
      plants,
      headline: left === 0 ? 'All plants happy' : (left === 1 ? '1 plant is thirsty' : left + ' plants are thirsty'),
      turnLine: w.p ? 'You’re done for today. Jonas is up next.' : 'Your turn: Pilea. Lea has the Monstera.'
    };
  }
}
</script>
</body>
</html>
